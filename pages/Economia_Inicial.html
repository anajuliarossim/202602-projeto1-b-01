<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sua economia anual</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../assets/css/style.css">
<script src="../assets/js/calculadora.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
<div class="app">
  <div class="corpo">
  <main data-tela="economia">
    <h1 data-campo="titulo">Sua economia estimada</h1>
    <nav class="abas" aria-label="Tipo de gráfico">
      <a href="Consumo_Inicial.html">Energia</a>
      <a href="Economia_Inicial.html" aria-current="page">Economia</a>
    </nav>
  <section class="painel economia">
    <div class="area"><div class="grafico" id="grafico"></div></div>
    <div class="meses" id="rotulos"></div>
    <div class="legenda"><span><i class="quadro"></i>Economia acumulada (kWh)</span></div>
  </section>
    <section class="resumo" aria-label="Resumo da economia">
      <div class="stat destaque"><i class="fa-solid fa-thumbs-up"></i><div><small>Economia mensal</small><b data-campo="valor1"></b></div></div>
      <div class="stat"><i class="fa-solid fa-chart-simple"></i><div><small>Economia total</small><b data-campo="valor2"></b></div></div>
      <div class="stat"><i class="fa-solid fa-piggy-bank"></i><div><small>Fatura com desconto</small><b data-campo="valor3"></b></div></div>
    </section>
  <div class="carrossel-pontos" id="pontos"></div>
    <a href="Calculadora_Inicial.html" class="btn-recalcular">
    <i class="fa-solid fa-rotate-right"></i> Calcular novamente
  </a>
  <p class="aviso" data-campo="premissas"></p>
  </main>
  </div>
  <nav class="nav" aria-label="Navegação principal">
    <a href="Calculadora_Inicial.html"><i class="fa-solid fa-house"></i>Início</a>
    <a href="#"><i class="fa-regular fa-file-lines"></i>Faturas</a>
    <a href="Consumo_Inicial.html" aria-current="page"><i class="fa-solid fa-bolt"></i>Consumo</a>
  </nav>
</div>
</body>
</html>
