<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bulbe | Página de Calculadora</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <div class="border">
    <header class="topo">
      <img src="../assets/img/Cabe%C3%A7alho%20Bulbe%20com%20Banner%20Promocional.png" alt="Imagem Banner Promocional Bulbe" class="BackgourndImg">
    </header>  
    <main class="calculadora">
      <h3>Analize aqui o quanto você pode economizar usando os serviços da Bulbe Energia!</h3>
      <div class="campo"> 
        <label for="TempoDeCalculo">Insira o tempo que deseja calcular em MESES: </label>
        <input id="TempoDeCalculo" type="number" placeholder="Ex:48 meses" min="1" required></input><br>
      </div> 
      <div class="campo"> 
        <label for="ConsumoMensal">Insira o Média de consumo MENSAL de energia: </label>
        <input id="ConsumoMensal" type="number" placeholder="Ex:330 Kwh" min="1" required></input><br>
      </div> 
    <p class="avisoCalculadora">Esse calculo é apenas uma aproximação, 
      dessa forma pode sofrer alterações devido fatores externos
      (descontos, cupons, etc.)</p>
      <button class="btn-confirmar">Confirmar</button>
    </main>
  </div>
</body>
</html>
