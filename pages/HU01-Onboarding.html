<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <title>Bulbe | Add onboarding</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">

<body class="telaOnboarding">
  <header class="barraSuperior">
  </header>
  <div id="ContainerOnb">
  <main class="onboarding">
    <div class="onboardingImg">
        <img src="../assets/img/IlustracaoOnbHU01.png" alt="Ilustração placa solar">
    </div>
    <div class="onboardingContent" id="Onb05">
        <h1>De onde vem seu desconto?</h1>

            <strong>reduzir o valor da sua conta de luz</strong>.</p>
    </div>
  </main>
      <div class="indicadorTelas"
          role="img"
          aria-label="Tela 1 de 5">
        <span class="bolinha"></span>
        <span class="bolinha"></span>
        <span class="bolinha"></span>
        <span class="bolinha"></span>
        <span class="bolinha ativa"></span>
        <span class="bolinha"></span>
      </div>
  <footer class="rodapeOnboarding">
    <button class="onboardingButton" id="Voltar">Voltar</button>
    <button class="onboardingButton" id="Proximo">Próximo</button>
  </footer>
  </div>
  <div class="barraInferior" aria-hidden="true"></div>
