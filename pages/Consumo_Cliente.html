<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seu consumo anual</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../assets/css/style.css">

</head>
<body>
  
  <div class="corpo">
    <header class="topo">
        <button class="menu-cabecalho button-template"
        id="abrirModal" aria-label="Abrir menu"
        aria-expanded="false" aria-controls="modalLateral">
         ☰
        </button>
        <img src="../assets/img/Logo-Bulbe-Branca.png" alt="Logo Bulbe" class="logo-cabecalho">
        <button class="notificacao-cabecalho button-template"><img src="../assets/img/SinoNot.png" alt="Notificações"></button>
        <button class="perfil-cabecalho button-template"><img src="../assets/img/Avatar.png" alt="Perfil"></button>
        <button class="faixa-indique button-template"><img src="../assets/img/Faixa-Indique.png" alt="Indique e Ganhe"></button>
    </header>
    <div class="fundoModal" id="fundoModal"></div>

      <aside class="modalLateral" id="modalLateral"
            aria-label="Menu principal" aria-hidden="true">

          <div class="cabecalhoModal">
              <img src="../assets/img/Logo-bulbe-inicial.png"
                  alt="Logo Bulbe" id="logoLateral">

              <button id="fecharModal" aria-label="Fechar menu">×</button>
          </div>

          <nav class="opcoesModal">
              <a href="Mapa.html" class="BotaoModal">
                  <img src="../assets/img/Icon-Map.png" alt="">
                  <span>Mapa da Bulbe</span>
              </a>

              <a href="Blog.html" class="BotaoModal">
                  <img src="../assets/img/Icon-Blog.png" alt="">
                  <span>Blog</span>
              </a>

              <a href="#" class="BotaoModal">
                  <img src="../assets/img/Icon-Question.png" alt="">
                  <span>Perguntas Frequentes</span>
              </a>

              <a href="#" class="BotaoModal">
                  <img src="../assets/img/Icon-Indique.png" alt="">
                  <span>Indique e ganhe</span>
              </a>

              <a href="#" class="BotaoModal">
                  <img src="../assets/img/Icon-Chat.png" alt="">
                  <span>Fale conosco</span>
              </a>

              <a href="#" class="BotaoModal">
                  <img src="../assets/img/Icon-Terms.png" alt="">
                  <span>Termos</span>
              </a>
          </nav>

          <a href="#" class="BotaoModal" id="Sair">
              <img src="../assets/img/Icon-Leave.png" alt="">
              <span>Sair</span>
          </a>

      </aside>
  <main>
    <h1>Seu consumo Mensal</h1>
    <nav class="abas" aria-label="Tipo de gráfico">
      <a href="Consumo_Cliente.html" aria-current="page">Energia</a>
      <a href="Economia_Cliente.html">Economia</a>
    </nav>

    <section class="painel">
      <div class="area">
        <div class="grafico">
          <div class="col"><div class="b" style="--h:85%" data-v="330 kWh"></div></div>
          <div class="col"><div class="b" style="--h:100%" data-v="390 kWh"></div></div>
          <div class="col"><div class="b" style="--h:68%" data-v="266 kWh"></div></div>
          <div class="col"><div class="b" style="--h:77%" data-v="301 kWh"></div></div>
          <div class="col"><div class="b" style="--h:67%" data-v="261 kWh"></div></div>
          <div class="col"><div class="b" style="--h:96%" data-v="373 kWh"></div></div>
        </div>
        <div class="media" style="--m:75%"></div>
      </div>
      <div class="meses"><span>Jan</span><span>Fev</span><span>Mar</span><span>Abr</span><span>Mai</span><span>Jun</span></div>
      <div class="legenda">
        <span><i class="tracejado"></i>Média de Consumo</span>
        <span><i class="quadro"></i>Consumo</span>
      </div>
    </section>

    <section class="resumo" aria-label="Resumo do consumo">
      <div class="stat destaque"><i class="fa-solid fa-bolt"></i><div><small>Média mensal</small><b>294 kWh</b><small>últimos 6 meses</small></div></div>
      <div class="stat"><i class="fa-solid fa-chart-simple"></i><div><small>Maior consumo</small><b>390 kWh</b><small>fevereiro</small></div></div>
      <div class="stat"><i class="fa-solid fa-bolt"></i><div><small>Menor consumo</small><b>261 kWh</b><small>maio</small></div></div>
    </section>
    <a href="Calculadora.html" class="btn-recalcular">Calcular minha economia</a>
  </main>
  <nav class="nav" aria-label="Navegação principal">
    <a href="Calculadora.html"><i class="fa-solid fa-house"></i>Início</a>
    <a href="#"><i class="fa-regular fa-file-lines"></i>Faturas</a>
    <a href="Consumo_Cliente.html" aria-current="page"><i class="fa-solid fa-bolt"></i>Consumo</a>
  </nav>
</div>
<script src="../assets/js/template.js"></script>
</body>
</html>
