<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bulbe | Central de Faturas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
  <script type="module" src="../assets/js/hu03.js"></script>
</head>
<body class="pagina-faturas telaComMenu">
  <div class="aplicativo">

    <!-- Cabeçalho: usa as mesmas classes do template do grupo. -->
    <div class="corpo">
      <header class="topo">
        <button class="menu-cabecalho button-template" id="abrirModal" aria-label="Abrir menu"
                aria-expanded="false" aria-controls="modalLateral" type="button">☰</button>
        <img class="logo-cabecalho" src="../assets/img/Logo-Bulbe-Branca.png" alt="Logo Bulbe">
        <button class="notificacao-cabecalho button-template" id="notificacoesBotao"
                aria-label="Notificações" aria-expanded="false" type="button">
          <img src="../assets/img/SinoNot.png" alt="">
        </button>
        <button class="perfil-cabecalho button-template" type="button" aria-label="Perfil">
          <img src="../assets/img/Avatar.png" alt="">
        </button>
        <button class="faixa-indique button-template" type="button">
          <img src="../assets/img/Faixa-Indique.png" alt="Indique e ganhe">
        </button>
      </header>
    </div>
    <p id="notificacoesPainel" class="aviso-notificacoes" hidden>Você não tem notificações no momento.</p>

<script src="../assets/js/template.js"></script>
</body>
</html>
