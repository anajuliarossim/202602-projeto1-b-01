<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<body class="pagina-cliente">

        </button>

        <button class="faixa-indique button-template"><img src="../assets/img/Faixa-Indique.png" alt="Indique e Ganhe"></button>
    </header>
    <div class="fundoModal" id="fundoModal"></div>

      <aside class="modalLateral" id="modalLateral"
            aria-label="Menu principal" aria-hidden="true">

          <div class="cabecalhoModal">
              <img src="../assets/img/Logo-bulbe-inicial.png"
                  alt="Logo Bulbe" id="logoLateral">

              <button id="fecharModal" aria-label="Fechar menu">×</button>
          </div>

          <nav class="opcoesModal">

<a href="Blog.html" class="BotaoModal">
                  <img src="../assets/img/Icon-Blog.png" alt="">

              </a>

              <a href="#" class="BotaoModal">
                  <img src="../assets/img/Icon-Question.png" alt="">

              <a href="#" class="BotaoModal">
                  <img src="../assets/img/Icon-Indique.png" alt="">

              <a href="#" class="BotaoModal">
                  <img src="../assets/img/Icon-Terms.png" alt="">

          </nav>

          <a href="#" class="BotaoModal" id="Sair">
              <img src="../assets/img/Icon-Leave.png" alt="">
              <span>Sair</span>
          </a>

      </aside>
  <main>
    <h1>Sua Economia Mensal</h1>
    <nav class="abas" aria-label="Tipo de gráfico">
      <a href="Consumo_Cliente.html">Energia</a>
      <a href="Economia_Cliente.html" aria-current="page">Economia</a>
    </nav>

    <section class="painel economia">
      <div class="area">
        <div class="grafico">
          <div class="col"><div class="b" style="--h:59%" data-v="R$ 38,18"></div></div>
          <div class="col"><div class="b" style="--h:100%" data-v="R$ 64,37"></div></div>
          <div class="col"><div class="b" style="--h:38%" data-v="R$ 24,50"></div></div>
          <div class="col"><div class="b" style="--h:54%" data-v="R$ 34,60"></div></div>
          <div class="col"><div class="b" style="--h:50%" data-v="R$ 32,20"></div></div>
          <div class="col"><div class="b" style="--h:88%" data-v="R$ 56,95"></div></div>
        </div>
        <div class="media" style="--m:50%"></div>
      </div>
      <div class="meses"><span>Jan</span><span>Fev</span><span>Mar</span><span>Abr</span><span>Mai</span><span>Jun</span></div>
      <div class="legenda">
        <span><i class="tracejado"></i>Média de Consumo</span>
        <span><i class="quadro"></i>Economia</span>
      </div>
    </section>

    <section class="resumo" aria-label="Resumo da economia">
      <div class="stat destaque"><i class="fa-solid fa-thumbs-up"></i><div><small>Melhor mês</small><b>R$ 64,37</b><small>fevereiro</small></div></div>
      <div class="stat"><i class="fa-solid fa-chart-simple"></i><div><small>Média mensal</small><b>R$ 41,80</b><small>últimos 6 meses</small></div></div>
      <div class="stat"><i class="fa-solid fa-piggy-bank"></i><div><small>Economia mensal</small><b>R$ 37,40</b><small>este mês</small></div></div>
    </section>
    <a href="Calculadora.html" class="btn-recalcular">Calcular minha economia</a>
  </main>
    <footer class="menu-footer" aria-label="Navegação principal">
        <button type="button" class="button-template" id="btnInicio" aria-label="Início">
            <img class="icone-footer icone-cinza" src="../assets/img/Icone-Inicio-Cinza.png" alt="">
            <img class="icone-footer icone-azul" src="../assets/img/Icone-Inicio-Azul.png" alt="">

            <img class="icone-footer icone-cinza" src="../assets/img/Icone-Consumo-Cinza.png" alt="">
            <img class="icone-footer icone-azul" src="../assets/img/Icone-Consumo-Azul.png" alt="">
        </button>
        <button type="button" class="button-template" id="btnMapa" aria-label="Mapa">
            <img class="icone-footer icone-cinza" src="../assets/img/Icone-Mapa-Cinza.png" alt="">
            <img class="icone-footer icone-azul" src="../assets/img/Icone-Mapa-Azul.png" alt="">
        </button>
    </footer>
