<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bulbe | Conexão Informativa</title>
  <link rel="stylesheet" href="../assets/css/style.css">
   <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  <script src="../assets/js/mascaras-formularios.js" defer></script>
  <style>
    /* Mantém a fonte dos antigos links ao usar botões nativos. */
    #confirmar-entrar { font-family: inherit; cursor: pointer; }
    #confirmar-entrar:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
  </style>
</head>
<body class="body-blank">
  <header class="topo-branco">
    <a href="Acesso.html"><img src="../assets/img/Seta-Retorno.png" alt="Voltar para Inicial" class="seta-retorno"></a>
    <img src="../assets/img/Logo-Bulbe-Azul.png" alt="Logo Bulbe" class="logo-azul-center">
  </header>
  <main class="blank">
    <h1 class="titulo-cadastro" id="titulo-entrar">Olá! Vamos acessar a sua conta Bulbe.</h1>
    <p  class="subtitulo-cadastro"><span id="duvida-entrar">Em caso de dúvidas, <a href="">clique aqui</a></span><br>Informe o e-mail cadastrado na Bulbe</p>

    <form id="form-entrar" action="Home.html" method="post" data-navegacao-validada>
        <div class="input-group">
        <label for="email">E-mail<i class="requirido">*</i></label>
        <input type="email" autocomplete="email" maxlength="254" autocapitalize="none" spellcheck="false" id="email" name="email" placeholder="exemplo@email.com" required>
        </div>
        <div class="input-group">
        <label for="senha">Senha<i class="requirido">*</i></label>
        <input type="password" autocomplete="current-password" id="senha" name="senha" placeholder="********" required>
        </div>
    </form>
        <a href="">Esqueci minha senha</a>
  </main>
  <footer>
    <button type="submit" form="form-entrar" id="confirmar-entrar">Confirmar</button>
  </footer>
</body>
</html>
