<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bulbe | Conexão Informativa</title>
  <link rel="stylesheet" href="../assets/css/style.css">
   <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  <script src="../assets/js/mascaras-formularios.js" defer></script>
  <style>
    /* Mantém a fonte dos antigos links ao usar botões nativos. */
    #next-cadastro { font-family: inherit; cursor: pointer; }
    #next-cadastro:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
  </style>
</head>
<body class="body-blank">
  <header class="topo-branco">
    <a href="Acesso.html"><img src="../assets/img/Seta-Retorno.png" alt="Voltar para Inicial" class="seta-retorno"></a>
    <img src="../assets/img/Logo-Bulbe-Azul.png" alt="Logo Bulbe" class="logo-azul-center">
  </header>
  <main class="blank">
    <div class="seguimento-cadastro">
        <p>1</p><span class="seta-avanço">→</span><p  class="seguimento-atual">2</p><span class="seta-avanço">→</span><p>3</p>
    </div>
    <h1 class="titulo-cadastro">Informe seu endereço</h1>
    <p  class="subtitulo-cadastro">Informe o endereço da unidade consumidora</p>

    <form id="form-cadastro2" action="Cadastro3.html" method="post" data-navegacao-validada>
        <div class="input-group">
        <label for="cep">CEP<i class="requirido">*</i></label>
        <input type="text" inputmode="numeric" autocomplete="postal-code" maxlength="9" pattern="[0-9]{5}-[0-9]{3}" data-mascara="cep" title="Use o formato 00000-000." id="cep" name="cep" placeholder="00000-000" required>
        </div>
        <div class="input-group">
        <label for="endereço">Endereço<i class="requirido">*</i></label>
        <input type="text" autocomplete="address-line1" maxlength="200" id="endereço" name="endereço" placeholder="Rua, Avenida..." required>
        </div>
        <div class="input-group">
        <label for="numeroE">Número<i class="requirido">*</i></label>
        <input type="text" maxlength="30" title="Informe o número, incluindo letras se necessário, ou s/n." id="numeroE" name="numeroE" placeholder="123, 12A ou s/n" required>
        </div>
        <div class="input-group">
        <label for="bairro">Bairro<i class="requirido">*</i></label>
        <input type="text" maxlength="100" id="bairro" name="bairro" placeholder="Seu bairro" required>
        </div>
        <div class="input-group">
        <label for="complemento">Complemento</label>
        <input type="text" autocomplete="address-line2" maxlength="150" id="complemento" name="complemento" placeholder="Apto, bloco...">
        </div>
    </form>
  </main>
  <footer id="footer2-cadastro">
    <a href="Cadastro1.html" id="back-cadastro">Voltar</a>
    <button type="submit" form="form-cadastro2" id="next-cadastro">Próximo</button>
  </footer>
</body>
</html>
