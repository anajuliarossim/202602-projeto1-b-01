<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bulbe | Página Calculadora</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <script src="../assets/js/calculadora.js" defer></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="corpo">
    <div class="corpo TelaCheia">
      <header class="topo">
        <button class="menu-cabecalho button-template"
        id="abrirModal" aria-label="Abrir menu"
        aria-expanded="false" aria-controls="modalLateral">
         ☰
        </button>
          <img src="../assets/img/Logo-Bulbe-Branca.png" alt="Logo Bulbe" class="logo-cabecalho">
          <button class="notificacao-cabecalho button-template"><img src="../assets/img/SinoNot.png" alt="Notificações"></button>
          <button class="perfil-cabecalho button-template"><img src="../assets/img/Avatar.png" alt="Perfil"></button>
          <button class="faixa-indique button-template"><img src="../assets/img/Faixa-Indique.png" alt="Indique e Ganhe"></button>
      </header>
      <main class="calculadora">
                  <div class="fundoModal" id="fundoModal"></div>

      <aside class="modalLateral" id="modalLateral"
            aria-label="Menu principal" aria-hidden="true">

          <div class="cabecalhoModal">
              <img src="../assets/img/Logo-bulbe-inicial.png"
                  alt="Logo Bulbe" id="logoLateral">

              <button id="fecharModal" aria-label="Fechar menu">×</button>
          </div>

          <nav class="opcoesModal">

<a href="Blog.html" class="BotaoModal">
                  <img src="../assets/img/Icon-Blog.png" alt="">
                  <span>Blog</span>
              </a>

              <a href="#" class="BotaoModal">
                  <img src="../assets/img/Icon-Question.png" alt="">
                  <span>Perguntas Frequentes</span>
              </a>

              <a href="#" class="BotaoModal">
                  <img src="../assets/img/Icon-Indique.png" alt="">
                  <span>Indique e ganhe</span>
              </a>

              <a href="#" class="BotaoModal">
                  <img src="../assets/img/Icon-Chat.png" alt="">
                  <span>Fale conosco</span>
              </a>

              <a href="#" class="BotaoModal">
                  <img src="../assets/img/Icon-Terms.png" alt="">
                  <span>Termos</span>
              </a>
          </nav>

          <a href="Acesso.html" class="BotaoModal" id="Sair">
              <img src="../assets/img/Icon-Leave.png" alt="">
              <span>Sair</span>
          </a>

      </aside>
        <div class="titulo-pagina">

        <h1>Calculadora de Economia</h1>
        <p class="texto_calculadora">Analize aqui o quanto você pode economizar usando os serviços da Bulbe Energia!</p>
      <form id="formCalculadora" data-destino="Consumo.html">
        <div class="campo"> 
          <label for="TempoDeCalculo">Insira o tempo que deseja calcular em MESES: </label>
          <input id="TempoDeCalculo" name="tempo"type="number" placeholder="Ex:48 meses" min="1" required></input><br>
        </div> 
        <div class="campo"> 
          <label for="ConsumoMensal">Insira o Média de consumo MENSAL de energia: </label>
          <input id="ConsumoMensal" name="consumo" type="number" placeholder="Ex:330 Kwh" min="1" required></input><br>
        </div> 
        <img src="../assets/img/UtsX1.png" alt="Banner Bulbe calculadora" class="ImgBanner">
      <p class="avisoCalculadora">Esse calculo é apenas uma aproximação, 
        dessa forma pode sofrer alterações devido fatores externos
        (descontos, cupons, etc.)</p>
        <button type ="submit" class="btn-confirmar">Confirmar</button>
      </form>
      </main>
  </div>
  <footer class="menu-footer" aria-label="Navegação principal">
        <button type="button" class="button-template" id="btnInicio" aria-label="Início">
            <img class="icone-footer icone-cinza" src="../assets/img/Icone-Inicio-Cinza.png" alt="">
            <img class="icone-footer icone-azul" src="../assets/img/Icone-Inicio-Azul.png" alt="">
        </button>
        <button type="button" class="button-template" id="btnFaturas" aria-label="Faturas">
            <img class="icone-footer icone-cinza" src="../assets/img/Icone-Fatura-Cinza.png" alt="">
            <img class="icone-footer icone-azul" src="../assets/img/Icone-Fatura-Azul.png" alt="">
        </button>
        <button type="button" class="button-template" id="btnConsumo" aria-label="Consumo">
            <img class="icone-footer icone-cinza" src="../assets/img/Icone-Consumo-Cinza.png" alt="">
            <img class="icone-footer icone-azul" src="../assets/img/Icone-Consumo-Azul.png" alt="">
        </button>
        <button type="button" class="button-template" id="btnMapa" aria-label="Mapa">
            <img class="icone-footer icone-cinza" src="../assets/img/Icone-Mapa-Cinza.png" alt="">
            <img class="icone-footer icone-azul" src="../assets/img/Icone-Mapa-Azul.png" alt="">
        </button>
    </footer>
  <script src="../assets/js/template.js"></script>
</body>
</html>
